services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ai_gateway
      POSTGRES_USER: honobox
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD}
    ports:
      - '127.0.0.1:5433:5432'
    volumes:
      - honobox-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U honobox -d ai_gateway']
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  honobox-postgres:
